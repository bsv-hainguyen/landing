<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aether · Beyond the Horizon</title>
  <meta name="description" content="Aether is a living intelligence network that learns, adapts and evolves with you." />
  <meta name="theme-color" content="#04050b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="page">
    <header class="nav reveal" style="--d: 0.05s">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>AETHER</span>
      </div>
    </header>

    <main class="hero">
      <section class="copy">
        <p class="eyebrow reveal" style="--d: 0.25s">
          <span class="pulse-dot" aria-hidden="true"></span>
          Now in private beta
        </p>
        <h1 class="reveal" style="--d: 0.35s">
          Intelligence<br />
          <span class="grad">beyond the horizon.</span>
        </h1>
      </section>

      <div class="aside">
        <p class="lead reveal" style="--d: 0.5s">
          A living network that learns, adapts and evolves with you.
          Built for the next decade, ready today.
        </p>
      </div>
    </main>

    <footer class="foot reveal" style="--d: 0.75s">
      <span>&copy; 2026 Aether Labs</span>
      <span class="telemetry" aria-hidden="true">
        <span>Sync <b id="t-sync">99.82%</b></span>
        <span>Nodes <b id="t-nodes">12,480</b></span>
        <span>Latency <b id="t-lat">4ms</b></span>
      </span>
      <span class="hint">Drag to rotate &middot; Click to pulse</span>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
